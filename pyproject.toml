[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-research"
version = "0.1.3"
description = "Axiom Research R0 definitions, manifests and identity contracts"
requires-python = ">=3.11"
dependencies = ["axiom-engine>=0.1.0"]

[project.optional-dependencies]
build = ["axiom-data>=0.3.4", "pyarrow>=14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
axiom_research = ["fixtures/*.json"]
